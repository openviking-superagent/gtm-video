      const cur = $("#c-cursor");
      gsap.set(cur, { transformOrigin: "4px 3px", x: 1960, y: 1120 });
      const tip = (p) => ({ x: p.x - 7, y: p.y - 4 });
      const moveTo = (p, at, d) => tl.to(cur, Object.assign({ duration: d || 0.7, ease: "power2.inOut" }, tip(p)), at);
      const click = (at, target) => {
        tl.to(cur, { scale: 0.82, duration: 0.07, ease: "power2.in" }, at);
        tl.to(cur, { scale: 1, duration: 0.14, ease: "power2.out" }, at + 0.07);
        if (target) {
          tl.to(target, { scale: 0.95, duration: 0.07, ease: "power2.in" }, at);
          tl.to(target, { scale: 1, duration: 0.16, ease: "power2.out" }, at + 0.07);
        }
      };
      const capIn = (id, a, b) => {
        tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, a);
        tl.to(id, { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, b);
      };
      const swap = (outEl, inEl, at) => {
        tl.to(outEl, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, at);
        tl.fromTo(inEl, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, at + 0.12);
      };

      // ---------- initial states ----------
      gsap.set("#c-chat", { opacity: 0 });
      gsap.set(["#c-usrc", "#c-ubub", "#c-bwho", "#c-b1", "#c-b2", "#c-b3", "#c-form", "#c-start"], { opacity: 0 });
      gsap.set(".dc", { opacity: 0, scale: 0.7 });
      gsap.set("#c-typed", { opacity: 1 });
      gsap.set(".tc", { opacity: 0 });
      gsap.set(".wr", { opacity: 0, x: -16 });
      gsap.set("#c-dlg", { opacity: 0, scale: 0.94, transformOrigin: "50% 50%" });
      gsap.set(".ia", { opacity: 0, y: 10 });
      gsap.set([".ks", ".ka", "#c-cr1", "#c-cr2"], { opacity: 0, y: 14 });
      gsap.set("#c-fp-t", { clipPath: "inset(0% 100% 0% 0%)" });

      // ---------- 0: console arrives ----------
      tl.fromTo("#c-win", { scale: 1.035, filter: "blur(10px)", transformOrigin: "50% 50%" }, { scale: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 0);
      capIn("#c-cap1", 0.45, 2.55);

      // ---------- pick Wiki ----------
      tl.to(cam, Object.assign({ duration: 0.8, ease: "power2.inOut" }, camTo(1643, 700, 1.38, 1600, 470)), 1.2);
      moveTo(pt.wiki, 1.25, 0.85);
      click(2.15, "#c-chip-wiki");
      tl.to("#c-chip-act", { opacity: 1, duration: 0.15 }, 2.2);
      tl.to("#c-focus", { opacity: 1, duration: 0.2 }, 2.25);
      tl.to("#c-ph", { opacity: 0, duration: 0.1 }, 2.3);
      tl.to(".tc", { opacity: 1, duration: 0.01, stagger: 1.1 / chars.length }, 2.35);
      capIn("#c-cap2", 2.7, 4.6);

      // ---------- open directory picker ----------
      moveTo(pt.src, 3.6, 0.65);
      click(4.3, "#c-srcbtn");
      tl.to(cam, Object.assign({ duration: 0.7, ease: "power2.inOut" }, camTo(960, 541, 1.14, 960, 468)), 4.35);
      tl.to("#c-backdrop", { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.4);
      tl.to("#c-dlg", { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 4.45);
      capIn("#c-cap3", 5.0, 8.3);

      const nums = $$("#c-num > span");
      [pt.cb1, pt.cb2, pt.cb3].forEach((p, i) => {
        const t = 5.6 + i * 0.75;
        moveTo(p, t - 0.55, 0.5);
        click(t);
        tl.fromTo("#c-cb" + (i + 1) + " .on", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: "expo.out" }, t + 0.03);
        tl.set(nums[i], { opacity: 0 }, t + 0.05);
        tl.set(nums[i + 1], { opacity: 1 }, t + 0.05);
      });
      moveTo(pt.ok, 7.55, 0.55);
      click(8.15, "#c-okbtn");
      tl.to("#c-dlg", { opacity: 0, scale: 0.96, duration: 0.22, ease: "power2.in" }, 8.3);
      tl.to("#c-backdrop", { opacity: 0, duration: 0.25 }, 8.35);
      tl.to(cam, Object.assign({ duration: 0.7, ease: "power2.inOut" }, camTo(1643, 700, 1.38, 1600, 470)), 8.35);
      tl.to(".dc", { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", stagger: 0.09 }, 8.6);

      // ---------- send ----------
      moveTo(pt.send, 8.9, 0.7);
      click(9.75, "#c-send");
      tl.to(["#c-empty"], { opacity: 0, filter: "blur(6px)", duration: 0.2 }, 9.85);
      tl.to(["#c-typed", ".dc", "#c-focus"], { opacity: 0, duration: 0.15 }, 9.85);
      tl.to("#c-ph", { opacity: 1, duration: 0.2 }, 10.0);
      tl.to("#c-chip-act", { opacity: 0, duration: 0.2 }, 10.0);
      tl.set("#c-chat", { opacity: 1 }, 9.9);
      // ---------- wiki appears in the tree ----------
      tl.to(cam, Object.assign({ duration: 0.8, ease: "power2.inOut" }, camTo(330, 800, 1.42, 700, 470)), 12.6);
      capIn("#c-cap5", 13.25, 15.3);
      tl.to(".wr", { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.14 }, 13.2);
      tl.fromTo(cur, { x: 1100, y: 1100 }, Object.assign({ duration: 0.8, ease: "power2.out", immediateRender: false }, tip(pt.idx)), 14.4);
      click(15.25);
      tl.to("#c-sel-meet", { opacity: 0, duration: 0.15 }, 15.3);
      tl.to("#c-sel-idx", { opacity: 1, duration: 0.15 }, 15.3);

      // ---------- index.md opens ----------
      swap("#c-tab1-a", "#c-tab1-b", 15.3);
      swap("#c-L-doc", "#c-L-idx", 15.3);
      tl.to(cam, Object.assign({ duration: 0.8, ease: "power2.inOut" }, camTo(950, 470, 1.26, 960, 430)), 15.4);
      tl.to(".ia", { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", stagger: 0.09 }, 15.6);
      tl.to(cur, { x: 1980, y: 1100, duration: 0.8, ease: "power2.in" }, 15.6);
      capIn("#c-cap6", 15.8, 19.6);
      // slow scroll at a constant scale: snap the translate to whole pixels so every glyph keeps the same
      // sub-pixel phase and the text moves rigidly with its boxes (fractional translates re-snap each glyph per frame = jitter)
      tl.to(cam, Object.assign({ duration: 2.8, ease: "power1.inOut", snap: "x,y" }, camTo(950, 640, 1.26, 960, 430)), 16.9);

      // ---------- kanban ----------
      tl.to(cam, Object.assign({ duration: 0.8, ease: "power2.inOut" }, FULL), 19.6);
      tl.fromTo(cur, { x: 1300, y: 1100 }, Object.assign({ duration: 0.75, ease: "power2.out", immediateRender: false }, tip(pt.tab2)), 19.75);
      click(20.55, "#c-tab2");
      tl.to("#c-tab1-on", { opacity: 0, duration: 0.15 }, 20.6);
      tl.to("#c-tab2-on", { opacity: 1, duration: 0.15 }, 20.6);
      tl.to("#c-tab2-l", { color: "#1f2329", duration: 0.15 }, 20.6);
      swap("#c-L-idx", "#c-L-kan", 20.6);
      tl.to(cam, Object.assign({ duration: 0.8, ease: "power2.inOut" }, camTo(950, 600, 1.24, 960, 440)), 20.75);
      tl.to(".ks", { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", stagger: 0.08 }, 20.9);
      tl.to(".ka", { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 21.3);
      tl.to(["#c-cr1", "#c-cr2"], { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.2 }, 21.45);
      tl.fromTo(".warn", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", stagger: 0.1 }, 21.6);
      capIn("#c-cap7", 21.3, 24.4);

      // open conflict inline, then resolve it via the edit action
      tl.to(cur, Object.assign({ duration: 0.7, ease: "power2.inOut" }, tip(pt.cr1)), 22.7);
      click(23.5, "#c-cr1");
      tl.to("#c-cr1-hl", { opacity: 1, duration: 0.15 }, 23.55);
      tl.fromTo("#c-det", { height: 0 }, { height: detH, duration: 0.55, ease: "power3.out", immediateRender: false }, 23.62);
      tl.fromTo("#c-det .dgrid > *", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.025, immediateRender: false }, 23.72);
      capIn("#c-cap8", 24.6, 27.4);
      tl.to(cur, Object.assign({ duration: 0.65, ease: "power2.inOut" }, tip(pt.edit)), 24.25);
      click(24.95, "#c-edit");
      tl.to("#c-edit", { backgroundColor: "#ffe9e2", color: "#e8453c", duration: 0.15 }, 25.0);
      tl.set("#c-fp0", { opacity: 0 }, 25.02);
      tl.fromTo("#c-fp-box", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 25.02);
      tl.fromTo("#c-fp-t", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(18)", immediateRender: false }, 25.08);
      tl.to("#c-fp-box", { opacity: 0, duration: 0.2 }, 25.68);
      tl.to("#c-edit", { backgroundColor: "#f3f4f7", color: "#4b5260", duration: 0.2 }, 25.68);
      tl.set("#c-ft0", { opacity: 0 }, 25.7);
      tl.fromTo("#c-ft1", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out" }, 25.7);
      tl.set("#c-fb0", { opacity: 0 }, 25.78);
      tl.fromTo("#c-fb1", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out" }, 25.78);
      tl.set("#c-cr1-p", { opacity: 0 }, 25.82);
      tl.fromTo("#c-cr1-d", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 25.82);
      tl.set("#c-k-2", { opacity: 0 }, 25.9);
      tl.fromTo("#c-k-1", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 25.9);
      tl.to("#c-r-c1 .warn", { opacity: 0, duration: 0.25 }, 25.95);
      tl.to("#c-cr1-hl", { opacity: 0, duration: 0.3 }, 26.2);

      // pull back: the whole workspace
      tl.to(cur, { x: 1980, y: 1100, duration: 0.6, ease: "power2.in" }, 26.0);
      tl.to(cur, { opacity: 0, duration: 0.15 }, 26.65); // parked cursor would show once the camera pulls back
      // to the overview by a short fade, not a camera move (moving/scaling text stutters); framing then stays static
      tl.to(cam, { opacity: 0, duration: 0.25, ease: "power1.in" }, 26.6);
      tl.set(cam, { x: 133.7, y: -14.4, scale: 0.86 }, 26.85);
      tl.to(cam, { opacity: 1, duration: 0.35, ease: "power1.out" }, 26.86);
      capIn("#c-cap9", 27.6, 30.6);

      // exit: the window recedes
      tl.to("#c-win", { scale: 0.62, x: -380, filter: "blur(6px)", opacity: 0, duration: 0.9, ease: "power3.in" }, 31.0);

      // conversation hold: VikingBot asks for compile parameters before compiling starts
      const CONV = 4.2;
      // voiceover holds: [stage time, hold seconds]; everything at or after a hold point shifts later
      const HOLDS = [[1.15, 1.75], [4.28, 0.35], [10.5, CONV], [15.2, 0.6], [27.6, 0.6], [30.55, 0.5]];
      const W = (t) => HOLDS.reduce((a, h) => a + (t >= h[0] - 1e-6 ? h[1] : 0), t);
      tl.getChildren(false, true, true).forEach((c) => c.startTime(W(c.startTime())));

      // ---------- VikingBot conversation (final timeline seconds, authored after the hold remap) ----------
      // send click lands at 11.85; compile starts at 16.3 (narration line 06 begins with it)
      const SCR = Math.max(0, $("#c-chatin").offsetHeight - $("#c-chat").offsetHeight + 12);
      tl.to(".chips", { opacity: 0, duration: 0.2 }, 11.95);
      tl.to(cam, Object.assign({ duration: 0.8, ease: "power2.inOut" }, camTo(1643, 560, 1.38, 1600, 520)), 11.95);
      tl.fromTo("#c-usrc", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 12.0);
      tl.fromTo("#c-ubub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 12.08);
      tl.to(cur, Object.assign({ duration: 0.8, ease: "power2.inOut" }, tip({ x: 1700, y: 900 })), 12.2);
      tl.fromTo("#c-bwho", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 12.55);
      tl.fromTo("#c-b1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 12.7);
      tl.fromTo("#c-b2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 13.15);
      tl.fromTo("#c-b3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 13.55);
      // form card arrives; chat scrolls up once (short, eased, whole pixels)
      tl.to("#c-chatin", { y: -SCR, duration: 0.55, ease: "power3.inOut", snap: "y" }, 14.05);
      tl.fromTo("#c-form", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 14.15);
      const up = (p) => ({ x: p.x, y: p.y - SCR });
      moveTo(up(pt.fsel), 14.35, 0.55);
      click(14.95, "#c-fsel");
      tl.fromTo("#c-fopts", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, 15.0);
      tl.to("#c-fo1", { backgroundColor: "#fff1ea", duration: 0.12 }, 15.35);
      moveTo(up(pt.fo1), 15.1, 0.35);
      click(15.5);
      tl.to("#c-fopts", { opacity: 0, duration: 0.15 }, 15.58);
      tl.set("#c-fv0", { opacity: 0 }, 15.6);
      tl.fromTo("#c-fv1", { opacity: 0 }, { opacity: 1, duration: 0.18 }, 15.6);
      moveTo(up(pt.fok), 15.65, 0.5);
      click(16.2, "#c-fok");
      tl.set("#c-fok0", { opacity: 0 }, 16.27);
      tl.set("#c-fok1", { opacity: 1 }, 16.27);
      tl.to("#c-fok", { backgroundColor: "#9aa0ab", duration: 0.2 }, 16.27);
      tl.fromTo("#c-start", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 16.35);
      tl.fromTo(".dotp", { scale: 0.4 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 16.35);
      tl.to(cur, { x: 1980, y: 1100, duration: 0.7, ease: "power2.in" }, 16.55);
      capIn("#c-cap4", 16.4, 19.3);

      window.__timelines["console"] = tl;
    })();
  </script>
</template>
