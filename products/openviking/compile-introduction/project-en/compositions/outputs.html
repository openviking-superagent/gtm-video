        report: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
        users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/>',
        compile: '<path d="M4 6h7M4 12h5M4 18h7"/><path d="M14 8l4 4-4 4"/><path d="M20 4v16"/>',
        bolt: '<path d="M13 2.5L4.5 14h6.5l-1 7.5L18.5 10H12z"/>',
        layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
      };
      document.querySelectorAll('[data-composition-id="outputs"] .oi[data-i]').forEach((el) => {
        el.innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[el.dataset.i] || "") + "</svg>";
      });
      const R = document.querySelector('[data-composition-id="outputs"]');
      const $$ = (s) => Array.from(R.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });

      gsap.set(["#o-h2"], { opacity: 0 });
      gsap.set(["#o-v2", "#o-v3"], { opacity: 0 });
      gsap.set(".ofeat", { opacity: 0, y: 40 });
      gsap.set("#o-bar", { scaleX: 0 });
      gsap.set(".ov3", { opacity: 0, x: -10 });
      gsap.set("#o-dia", { y: 44 });

      // arrive: the workspace becomes the context card
      tl.fromTo("#o-ctx", { opacity: 0, x: -140, scale: 1.12, filter: "blur(8px)" }, { opacity: 1, x: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.3);
      tl.fromTo("#o-h1 span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out", stagger: 0.2 }, 0.55);
      tl.fromTo("#o-a1", { opacity: 0, scaleX: 0, transformOrigin: "0 50%" }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.7);
      tl.fromTo("#o-node", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0.85);
      tl.fromTo("#o-a2", { opacity: 0, scaleX: 0, transformOrigin: "0 50%" }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.05);
      tl.fromTo("#o-out", { opacity: 0, x: 40, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 1.15);

      // flowing dots along both arrows (finite repeats)
      [["#o-a1", 150], ["#o-a2", 120]].forEach(([a, w], j) => {
        $$(a + " .odot").forEach((d, i) => {
          tl.fromTo(d, { x: -6, opacity: 0 }, { x: w - 6, opacity: 1, duration: 0.9, ease: "power1.in", repeat: 13, delay: 0 }, 1.2 + j * 0.3 + i * 0.3);
        });
      });

      // source highlights per skill
      const hl = (ids, at) => {
        $$(".ohl").forEach((el) => tl.to(el, { opacity: 0, duration: 0.2 }, at));
        ids.forEach((id) => tl.to("#o-r" + id + " .ohl", { opacity: 1, duration: 0.25 }, at + 0.05));
      };
      hl([1, 2, 3], 1.3);

      // skill rolls: Wiki -> Daily report -> team-notes
      const roll = (to, at) => tl.to("#o-strip", { y: -40 * to, duration: 0.35, ease: "power3.inOut" }, at);
      const vswap = (a, b, at) => {
        tl.to(a, { opacity: 0, filter: "blur(8px)", x: -20, duration: 0.2, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, filter: "blur(8px)", x: 24 }, { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.35, ease: "expo.out" }, at + 0.18);
      };
      roll(1, 3.6);
      hl([5, 2, 3], 3.6);
      vswap("#o-v1", "#o-v2", 3.7);
      roll(2, 4.6);
      hl([3, 4, 5], 4.6);
      vswap("#o-v2", "#o-v3", 4.7);

      // phase 2: always up to date
      tl.to("#o-h1 span", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.05 }, 6.85);
      tl.fromTo("#o-h2 span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out", stagger: 0.2 }, 7.1);
      tl.set("#o-h2", { opacity: 1 }, 7.1);
      tl.to("#o-dia", { scale: 0.66, y: 34, duration: 0.8, ease: "power3.inOut", transformOrigin: "50% 0%" }, 6.9);
      // each feature lands on its word in the narration
      tl.to("#o-f1", { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 9.35);
      tl.to("#o-f2", { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 10.2);
      tl.to("#o-f3", { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 11.1);
      // mini actions inside each feature
      tl.fromTo("#o-hand", { rotation: 0 }, { rotation: 720, duration: 3.8, ease: "power1.inOut" }, 9.45);
      tl.fromTo("#o-new", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 10.4);
      tl.to("#o-bar", { scaleX: 5 / 42, duration: 0.6, ease: "power2.out" }, 10.7);
      tl.to(".ov3", { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", stagger: 0.25 }, 11.3);

      // exit into the end card
      tl.to(["#o-heads", "#o-dia", ".ofeat"], { opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 13.5);
      // English narration runs longer: extra holds in local seconds (all children at/after a point shift later)
      const EN_HOLDS = [[12.7, 0.7]];
      const EW = (t) => EN_HOLDS.reduce((a, h) => a + (t >= h[0] - 1e-6 ? h[1] : 0), t);
      tl.getChildren(false, true, true).forEach((c) => c.startTime(EW(c.startTime())));
      window.__timelines["outputs"] = tl;
    })();
  </script>
